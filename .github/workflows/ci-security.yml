# Updated ci-security.yml with fixes for all issues
name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'  # Weekly scan on Sunday at 2 AM UTC

permissions:
  contents: read
  security-events: write

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: '${{ github.repository }}'
          path: '.'
          format: 'ALL'
          args: >
            --enableRetired
            --enableExperimental
            --failOnCVSS 8
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      
      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  codeql-analysis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'python']
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # Separate Go CodeQL job with custom build
  codeql-analysis-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for Go files
        id: check-go
        run: |
          if [ -f backend/go.mod ]; then
            echo "has_go=true" >> $GITHUB_OUTPUT
          else
            echo "has_go=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Initialize CodeQL for Go
        if: steps.check-go.outputs.has_go == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-and-quality
      
      - name: Setup Go
        if: steps.check-go.outputs.has_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Build Go project
        if: steps.check-go.outputs.has_go == 'true'
        working-directory: backend
        run: |
          go mod download
          go build ./...
      
      - name: Perform CodeQL Analysis for Go
        if: steps.check-go.outputs.has_go == 'true'
        uses: github/codeql-action/analyze@v3

  docker-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for Dockerfiles
        id: check-dockerfiles
        run: |
          if [ -f frontend/Dockerfile ] || [ -f backend/Dockerfile ]; then
            echo "has_dockerfiles=true" >> $GITHUB_OUTPUT
          else
            echo "has_dockerfiles=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Build Docker images
        if: steps.check-dockerfiles.outputs.has_dockerfiles == 'true'
        run: |
          if [ -f frontend/Dockerfile ]; then
            docker build -t ${{ github.event.repository.name }}-frontend ./frontend
          fi
          if [ -f backend/Dockerfile ]; then
            docker build -t ${{ github.event.repository.name }}-backend ./backend
          fi
      
      - name: Run Trivy on Docker images
        if: steps.check-dockerfiles.outputs.has_dockerfiles == 'true'
        run: |
          # Scan frontend image if exists
          if [ -f frontend/Dockerfile ]; then
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image ${{ github.repository }}-frontend \
              --severity CRITICAL,HIGH \
              --exit-code 1
          fi
          # Scan backend image if exists
          if [ -f backend/Dockerfile ]; then
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image ${{ github.repository }}-backend \
              --severity CRITICAL,HIGH \
              --exit-code 1
          fi

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for scanning
      
      - name: Check if there are changes to scan
        id: check-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, compare with base branch
            if git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD | grep -q .; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          else
            # For pushes, always scan
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: TruffleHog OSS
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
      
      - name: Gitleaks
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SAST - Static Application Security Testing
  sast-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for Python files
        id: check-python
        run: |
          if [ -f backend/requirements.txt ] || [ -f backend/pyproject.toml ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Python
        if: steps.check-python.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Bandit
        if: steps.check-python.outputs.has_python == 'true'
        run: pip install bandit[toml]
      
      - name: Run Bandit security scan
        if: steps.check-python.outputs.has_python == 'true'
        working-directory: backend
        run: |
          bandit -r app -f json -o bandit-report.json || true
          bandit -r app -lll || true
      
      - name: Upload Bandit report
        if: steps.check-python.outputs.has_python == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json

  sast-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install ESLint security plugin
        run: npm install -g eslint eslint-plugin-security
      
      - name: Run ESLint security scan
        run: |
          npx eslint . --ext .js,.jsx,.ts,.tsx \
            --plugin security \
            --rule 'security/detect-object-injection: error' \
            --rule 'security/detect-non-literal-regexp: error' \
            --rule 'security/detect-unsafe-regex: error' \
            --format json --output-file eslint-security-report.json || true
      
      - name: Upload ESLint security report
        uses: actions/upload-artifact@v4
        with:
          name: eslint-security-report
          path: eslint-security-report.json

  sast-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for Go files
        id: check-go
        run: |
          if [ -f backend/go.mod ]; then
            echo "has_go=true" >> $GITHUB_OUTPUT
          else
            echo "has_go=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Go
        if: steps.check-go.outputs.has_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Install gosec
        if: steps.check-go.outputs.has_go == 'true'
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      
      - name: Run gosec security scan
        if: steps.check-go.outputs.has_go == 'true'
        working-directory: backend
        run: |
          gosec -fmt=json -out=gosec-report.json ./... || true
          gosec -severity=medium ./... || true
      
      - name: Upload gosec report
        if: steps.check-go.outputs.has_go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: backend/gosec-report.json

  # Optional healthcare security checks (if patterns exist)
  hipaa-security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for healthcare patterns
        id: check-hipaa
        run: |
          if [ -d backend/app/models ] || [ -d frontend ]; then
            echo "has_hipaa_patterns=true" >> $GITHUB_OUTPUT
          else
            echo "has_hipaa_patterns=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Check for PHI patterns in logs (best-effort)
        if: steps.check-hipaa.outputs.has_hipaa_patterns == 'true'
        run: |
          ! grep -r -i -E "(console\.log|logger\.|print)" . | grep -i -E "(patient|ssn|dob|diagnosis)" || true
      
      - name: Verify encryption usage markers (best-effort)
        if: steps.check-hipaa.outputs.has_hipaa_patterns == 'true'
        run: |
          grep -r "@Encrypted" backend/app/models || true
  
  financial-security-check:
    if: ${{ vars.INDUSTRY == 'finance' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for financial data exposure
        run: |
          # Ensure no account numbers or financial data in logs
          ! grep -r -i -E "(console\.log|logger\.|print)" . | grep -i -E "(account_number|routing|credit_card)"
      
      - name: Verify transaction integrity
        run: |
          # Check for transaction atomicity patterns
          grep -r "@Transactional" backend/ || grep -r "BEGIN.*COMMIT" backend/ || exit 1

  infrastructure-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Terraform security scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: false
      
      - name: Check for Kubernetes files
        id: check-k8s
        run: |
          if [ -d k8s ] && ls k8s/*.yaml 1> /dev/null 2>&1; then
            echo "has_k8s=true" >> $GITHUB_OUTPUT
          else
            echo "has_k8s=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Kubernetes security scan
        if: steps.check-k8s.outputs.has_k8s == 'true'
        run: |
          # Install kubesec
          wget -O kubesec https://github.com/controlplaneio/kubesec/releases/download/v2.11.0/kubesec_linux_amd64
          chmod +x kubesec
          
          # Scan Kubernetes manifests
          for file in k8s/*.yaml; do
            ./kubesec scan $file
          done

  security-report:
    needs: [dependency-check, trivy-scan, codeql-analysis, codeql-analysis-go, docker-scan, secret-scanning, sast-python, sast-javascript, sast-go]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate security report
        run: |
          echo "# Security Scan Report" > security-report.md
          echo "Date: $(date)" >> security-report.md
          echo "" >> security-report.md
          
          echo "## Summary" >> security-report.md
          echo "- Dependency Check: ${{ needs.dependency-check.result }}" >> security-report.md
          echo "- Trivy Scan: ${{ needs.trivy-scan.result }}" >> security-report.md
          echo "- CodeQL Analysis: ${{ needs.codeql-analysis.result }}" >> security-report.md
          echo "- CodeQL Go Analysis: ${{ needs.codeql-analysis-go.result }}" >> security-report.md
          echo "- Docker Scan: ${{ needs.docker-scan.result }}" >> security-report.md
          echo "- Secret Scanning: ${{ needs.secret-scanning.result }}" >> security-report.md
          echo "" >> security-report.md
          
          if [ -n "${{ vars.COMPLIANCE }}" ]; then
            echo "## Compliance Requirements" >> security-report.md
            echo "- Compliance Standards: ${{ vars.COMPLIANCE }}" >> security-report.md
            echo "- Enhanced Security Checks: Enabled" >> security-report.md
          fi
      
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
      
      - name: Check security gate
        run: |
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "❌ Security gate failed - vulnerabilities found"
            exit 1
          else
            echo "✅ Security gate passed - no critical vulnerabilities"
          fi