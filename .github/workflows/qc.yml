name: Quality Control

on:
  pull_request:
  workflow_dispatch:

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Bootstrap
        run: make bootstrap
      - name: Plan & Validate
        run: make plan
      - name: Preflight Selection Gate
        run: make preflight
      - name: QC metrics & gates
        run: make qc

