name: Nightly Dry Run

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Bootstrap (strict doctor)
        run: make bootstrap
      - name: Plan & Validate
        run: make plan
      - name: Preflight Selection Gate
        run: make preflight
      - name: Generator Dry Run Only
        run: make dryrun
      - name: Stack Install & Tests (if scaffold provides)
        run: make test || true
      - name: QC metrics (advisory)
        run: make qc || true
